<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo General - Notas Entregadas</title>
    <style>
        html, body {
            width: 100% !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 20px !important;
            background-color: #070c16 !important;
            color: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        .contenedor-completo { width: 100% !important; max-width: 96% !important; margin: 0 auto; }
        .encabezado { border-bottom: 2px solid #1e293b; padding-bottom: 12px; margin-bottom: 20px; }
        .titulo { font-size: 24px; font-weight: bold; color: #ffffff; margin: 0; }
        .subtitulo { font-size: 13px; color: #00d2ff; margin: 4px 0 0 0; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .grid-status-flujo-7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin-bottom: 25px; }
        .tarjeta-status-kpi { background-color: rgba(19, 28, 46, 0.85); border: 1.5px solid #1e293b; border-radius: 10px; padding: 14px 10px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: center; }
        .kpi-numero { font-size: 26px; font-weight: 800; color: #ffffff; margin-bottom: 4px; font-family: monospace; }
        .kpi-numero.blue { color: #3b82f6; } .kpi-numero.amarillo { color: #f59e0b; } .kpi-numero.cyan { color: #00d2ff; } .kpi-numero.verde { color: #10b981; }
        .kpi-texto { font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; line-height: 1.3; }

        .barra-filtros-archivo { display: flex; gap: 15px; margin-bottom: 20px; background-color: rgba(15, 23, 42, 0.6); padding: 12px; border-radius: 8px; border: 1px solid #1e293b; }
        .input-buscar-erp { flex: 1; background-color: #070c16; border: 1px solid #334155; border-radius: 6px; padding: 10px 14px; color: #ffffff; font-size: 14px; }
        .input-buscar-erp:focus { border-color: #00d2ff; outline: none; }
        .select-dpto-erp { background-color: #070c16; border: 1px solid #334155; border-radius: 6px; padding: 10px 14px; color: #ffffff; font-size: 14px; min-width: 180px; cursor: pointer; }

        .seccion-grupo-dpto { margin-bottom: 25px; }
        .cabecera-grupo-dpto { background-color: #0f172a; color: #00d2ff; font-size: 13px; font-weight: 800; padding: 10px 16px; border-radius: 8px 8px 0 0; border: 2px solid #1e293b; border-bottom: none; text-transform: uppercase; }
        .cuadro-tabla { background-color: rgba(19, 28, 46, 0.9); border: 2px solid #1e293b; border-radius: 0 0 12px 12px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .tabla-logistica { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        .tabla-logistica th { background-color: #16223f; color: #94a3b8; text-transform: uppercase; font-size: 11px; font-weight: 700; padding: 12px 16px; border-bottom: 1px solid #334155; }
        .tabla-logistica td { padding: 12px 16px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
        .tabla-logistica tr:hover { background-color: rgba(30, 41, 59, 0.5); }
        
        .badge-nota { font-family: monospace; font-weight: bold; color: #ffffff; background-color: #1e293b; padding: 4px 8px; border-radius: 4px; }
        .badge-vol { background-color: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #10b981; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-family: monospace; }
        .hora-marca { font-family: monospace; color: #cbd5e1; font-weight: 600; }
        .estado-vacio { text-align: center; color: #64748b; padding: 30px !important; font-size: 14px; }
    </style>
</head>
<body>

    <div class="contenedor-completo">
        <!-- ENCABEZADO LOGÍSTICO LOCAL -->
        <div class="encabezado">
            <h1 class="titulo">Módulo General - Notas Entregadas</h1>
            <p class="subtitulo">Historial completo con línea de tiempo y marcas de control de bultos</p>
        </div>

        <!-- REJILLA DE LOS 7 CUADROS DE STATUS LOCALES -->
        <div class="grid-status-flujo-7">
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero blue" id="kpiTotalDia">0</div>
                <div class="kpi-texto">Total Notas del Día</div>
            </div>
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero" id="kpiEnSeparacion">0</div>
                <div class="kpi-texto">En Separación</div>
            </div>
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero amarillo" id="kpiPendienteSeparar">0</div>
                <div class="kpi-texto">Pendiente a Separar</div>
            </div>
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero" id="kpiEnSalida">0</div>
                <div class="kpi-texto">En Salida</div>
            </div>
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero amarillo" id="kpiPendienteSalida">0</div>
                <div class="kpi-texto">Pendiente en Salida</div>
            </div>
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero cyan" id="kpiEnEntrega">0</div>
                <div class="kpi-texto">En Entrega</div>
            </div>
            <div class="tarjeta-status-kpi">
                <div class="kpi-numero verde" id="kpiPendienteEntregaEntregadas">0</div>
                <div class="kpi-texto">Pendiente en Entrega y Entregadas</div>
            </div>
        </div>

        <!-- BARRA DE BÚSQUEDA Y FILTRADO POR DEPARTAMENTO -->
        <div class="barra-filtros-archivo">
            <input type="text" id="txtBuscarNota" class="input-buscar-erp" placeholder="🔍 Buscar por Nro Nota o nombre de pedido (cliente)..." oninput="cargarYFiltrarHistorialLocal()">
            <select id="cmbFiltroDpto" class="select-dpto-erp" onchange="cargarYFiltrarHistorialLocal()">
                <option value="TODOS">-- Todos los Dptos --</option>
                <option value="7">Dpto 7</option>
                <option value="8">Dpto 8</option>
                <option value="21">Dpto 21</option>
                <option value="22">Dpto 22</option>
                <option value="23">Dpto 23</option>
                <option value="25">Dpto 25</option>
                <option value="58">Dpto 58</option>
            </select>
        </div>

        <div style="margin: 25px 0 15px 0;">
            <h2 style="color: #ffffff; font-size: 16px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: 0.5px;">📋 Registro General de Notas Finalizadas</h2>
        </div>
        <!-- CONTENEDOR DONDE SE DIBUJAN LAS TABLAS AGRUPADAS -->
        <div id="contenedorGruposDepartamentos"></div>
    </div>

    <!-- CONEXIÓN DIRECTA NATIVA CON TU BASE ESPEJO CENTRALIZADA EN RED -->
    <script src="base-datos.js"></script>

    <script>
        // FUNCIÓN CENTRAL: LEER BASE DE DATOS EN RED, CALCULAR KPIs Y DIBUJAR LAS 11 COLUMNAS
        function cargarYFiltrarHistorialLocal() {
            // 1. LEER DESDE EL CASILLERO WEB COMPARTIDO EN LUGAR DE LOCALSTORAGE
            if (!window.BaseDatosEspejo || typeof window.BaseDatosEspejo.obtenerNotas !== 'function') {
                console.error("El motor central de red base-datos.js no está disponible todavía.");
                return;
            }
            const listadoNotas = window.BaseDatosEspejo.obtenerNotas() || [];

            // 2. RECALCULAR LOS CONTADORES KPIs DE LOS 7 CUADROS SUPERIORES EN TIEMPO REAL
            const hoyStr = new Date().toLocaleDateString();
            const notasHoy = listadoNotas.filter(n => n.fechaCarga === hoyStr || n.fecha === hoyStr);

            if(document.getElementById("kpiTotalDia")) document.getElementById("kpiTotalDia").innerText = notasHoy.length;
            if(document.getElementById("kpiEnSeparacion")) document.getElementById("kpiEnSeparacion").innerText = listadoNotas.filter(n => n.estado === "En Proceso de Separación").length;
            if(document.getElementById("kpiPendienteSeparar")) document.getElementById("kpiPendienteSeparar").innerText = listadoNotas.filter(n => n.estado === "Por Separar" || n.estado === "Pending" || n.estado === "Pendiente").length;
            if(document.getElementById("kpiEnSalida")) document.getElementById("kpiEnSalida").innerText = listadoNotas.filter(n => n.estado === "En Proceso de Salida" || n.estado === "En Salida").length;
            if(document.getElementById("kpiPendienteSalida")) document.getElementById("kpiPendienteSalida").innerText = listadoNotas.filter(n => n.estado === "Por Dar Salida" || n.estado === "En Separación" || n.estado === "Pendiente en Salida").length;
            if(document.getElementById("kpiEnEntrega")) document.getElementById("kpiEnEntrega").innerText = listadoNotas.filter(n => n.estado === "Por Entregar" || n.estado === "Listo para Despacho" || n.estado === "En Entrega").length;
            
            // Conteo unificado para el casillero de notas concluidas en red ("Entregadas" o "Entregada")
            const concluidas = listadoNotas.filter(n => n.estado === "Entregadas" || n.estado === "Entregado" || n.estado === "Entregada").length;
            if(document.getElementById("kpiPendienteEntregaEntregadas")) document.getElementById("kpiPendienteEntregaEntregadas").innerText = concluidas;

            // 3. CAPTURAR FILTROS DE BÚSQUEDA NATIVOS ORIGINALES
            const inputTexto = document.getElementById("txtBuscarNota");
            const inputDpto = document.getElementById("cmbFiltroDpto");
            const contenedor = document.getElementById("contenedorGruposDepartamentos");
            
            if (!contenedor) return;
            contenedor.innerHTML = "";

            const filtroTexto = inputTexto ? inputTexto.value.trim().toLowerCase() : "";
            const filtroDpto = inputDpto ? inputDpto.value : "TODOS";

            // Al historial inferior ingresan los bultos concluidos en red ("Entregadas", "Entregado" o "Entregada")
            let notasFiltradas = listadoNotas.filter(n => n.estado === "Entregadas" || n.estado === "Entregado" || n.estado === "Entregada");

            // Aplicación estricta de filtros cruzados
            if (filtroDpto !== "TODOS") {
                notasFiltradas = notasFiltradas.filter(n => String(n.departamento || n.dpto || "") === filtroDpto);
            }

            if (filtroTexto !== "") {
                notasFiltradas = notasFiltradas.filter(n => 
                    String(n.id_nota || n.nroNota || n.id || "").toLowerCase().includes(filtroTexto) || 
                    String(n.propietario_pedido || n.pedidoDe || n.pedido || "").toLowerCase().includes(filtroTexto)
                );
            }

            if (notasFiltradas.length === 0) {
                contenedor.innerHTML = `<div class="cuadro-tabla" style="border-radius:12px;"><table class="tabla-logistica"><tr><td class="estado-vacio" style="text-align:center; padding:20px; color:#94a3b8;">⚠️ No hay registros de notas entregadas en la red con los filtros seleccionados.</td></tr></table></div>`;
                return;
            }

            // Agrupar dinámicamente las notas por Departamento original
            const grupos = {};
            notasFiltradas.forEach(nota => {
                const dptoNombre = nota.departamento || nota.dpto || "Sin Especificar";
                if (!grupos[dptoNombre]) grupos[dptoNombre] = [];
                grupos[dptoNombre].push(nota);
            });
            // 4. ORDENAR CRONOLÓGICAMENTE Y DIBUJAR LOS BLOQUES POR DEPARTAMENTO
            Object.keys(grupos).forEach(dptoKey => {
                let listaGrupo = grupos[dptoKey];

                // REGLA DE ORDENACIÓN: Las fechas más actuales se inyectan arriba del todo
                listaGrupo.sort((a, b) => new Date(b.fecha || b.fechaCarga || 0) - new Date(a.fecha || a.fechaCarga || 0));

                let bloqueHTML = `
                    <div class="seccion-grupo-dpto">
                        <div class="cabecera-grupo-dpto">📍 Notas del Departamento ${dptoKey}</div>
                        <div class="cuadro-tabla" style="overflow-x: auto;">
                            <table class="tabla-logistica">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Nro Nota</th>
                                        <th>Pedido de (Cliente)</th>
                                        <th>Separador</th>
                                        <th>Inicio / Término Sep</th>
                                        <th>Hora Salida</th>
                                        <th>Compañero (Salida)</th>
                                        <th>Inicio / Término Salida</th>
                                        <th>Volumen (VOL)</th>
                                        <th>Entregador</th>
                                        <th>Inicio / Término Entrega</th>
                                    </tr>
                                </thead>
                                <tbody>
                `;

                listaGrupo.forEach(n => {
                    // Mapeo adaptado contra respuestas de red compartida para evitar campos vacíos
                    let fechaOriginal = n.fecha || n.fechaCarga || "---";
                    let fechaVisual = "---";
                    if (fechaOriginal.includes("-")) {
                        const partes = fechaOriginal.split("-");
                        fechaVisual = partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : fechaOriginal;
                    } else {
                        fechaVisual = fechaOriginal;
                    }

                    // Formatear los números de nota cortando prefijos temporales de mosaico
                    let numeroNotaFormateado = (n.id_nota || n.id || n.nroNota || "---").replace("OP-", "");

                    // Equivalencias seguras de marcas de tiempos cruzadas entre pantallas
                    let hInicioSep = n.hora_inicio || n.tiempos?.separacion?.inicio || "---";
                    let hFinSep = n.hora_fin || n.tiempos?.separacion?.fin || "---";
                    
                    let hSalidaDespacho = n.hora_registro || n.horaSalida || "---";
                    let hCompaneroSalida = n.operador_salida || n.companero_salida || n.operadores?.salida || "---";
                    let hInicioSalida = n.hora_inicio_salida || n.tiempos?.salida?.inicio || "---";
                    let hFinSalida = n.hora_fin_salida || n.tiempos?.salida?.fin || "---";
                    
                    let volumenFisico = n.cantidad || n.vol || "0";
                    let hEntregador = n.entregador || n.operador_entrega || n.operadores?.entrega || "---";
                    let hInicioEntrega = n.hora_inicio_entrega || n.tiempos?.entrega?.inicio || "---";
                    let hFinEntrega = n.hora_fin_entrega || n.tiempos?.entrega?.fin || "---";

                    bloqueHTML += `
                        <tr>
                            <td style="white-space: nowrap; color: #94a3b8; font-weight: 500;">${fechaVisual}</td>
                            <td><span class="badge-nota">${numeroNotaFormateado}</span></td>
                            <td style="font-weight: 700; color: #ffffff; white-space: nowrap;">${n.propietario_pedido || n.pedidoDe || n.pedido || "---"}</td>
                            <td style="white-space: nowrap;">${n.separador || n.operadores?.separador || "---"}</td>
                            <td class="hora-marca" style="white-space: nowrap;">
                                <span style="color: #64748b;">I:</span> ${hInicioSep}<br>
                                <span style="color: #38bdf8;">T:</span> ${hFinSep}
                            </td>
                            <td class="hora-marca" style="color: #f59e0b;">${hSalidaDespacho} hs</td>
                            <td style="white-space: nowrap;">${hCompaneroSalida}</td>
                            <td class="hora-marca" style="white-space: nowrap;">
                                <span style="color: #64748b;">I:</span> ${hInicioSalida}<br>
                                <span style="color: #38bdf8;">T:</span> ${hFinSalida}
                            </td>
                            <td><span class="badge-vol">${volumenFisico} VOL</span></td>
                            <td style="white-space: nowrap; color: #00d2ff; font-weight: 600;">${hEntregador}</td>
                            <td class="hora-marca" style="white-space: nowrap;">
                                <span style="color: #64748b;">I:</span> ${hInicioEntrega}<br>
                                <span style="color: #10b981;">T:</span> ${hFinEntrega}
                            </td>
                        </tr>
                    `;
                });

                bloqueHTML += `</tbody></table></div></div>`;
                contenedor.innerHTML += bloqueHTML;
            });
        }

        // Ejecutar carga automática al iniciar la pantalla y escuchar actualizaciones multi-PC
        window.addEventListener('load', cargarYFiltrarHistorialLocal);
        window.addEventListener('storage', cargarYFiltrarHistorialLocal);
    </script>
</body>
</html>

        
</html>
